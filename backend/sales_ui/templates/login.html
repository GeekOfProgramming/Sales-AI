<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales-AI Operator Login</title>
  <link rel="stylesheet" href="/static/sales/sales.css">
  <style>
    body {
      background-color: var(--bg-primary, #0f172a);
      color: var(--text-primary, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-secondary, #1e293b);
      border: 1px solid var(--border-color, #334155);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: var(--brand-accent, #38bdf8);
    }
    .login-header p {
      font-size: 0.875rem;
      color: var(--text-muted, #94a3b8);
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-secondary, #cbd5e1);
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-primary, #0f172a);
      border: 1px solid var(--border-color, #334155);
      border-radius: 8px;
      color: var(--text-primary, #f8fafc);
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.15s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--brand-accent, #38bdf8);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--brand-accent, #0284c7);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s ease;
    }
    .btn-login:hover {
      background: #0369a1;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .login-footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color, #334155);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted, #64748b);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Sales-AI Operator Console</h1>
      <p>Please log in with your authorized operator account</p>
    </div>

    {% if error %}
    <div class="alert-error" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/sales/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url or '/sales/dashboard' }}">

      <div class="form-group">
        <label for="username">Operator Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="login-footer">
      <span>Private Local Network Access (SEC-01)</span>
    </div>
  </div>
</body>
</html>
