<!-- Reusable Mark as Sent Modal (FLOW-02) -->
<div id="mark-sent-modal" class="modal-overlay" onclick="handleMarkSentBackdrop(event)" style="display: none; z-index: 1060; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center;">
  <div class="modal-card" style="max-width: 580px; width: 95%; max-height: 90vh; display: flex; flex-direction: column; padding: 1.5rem; background: var(--bg-card, #1e293b); border: 1px solid var(--border-color, #334155); border-radius: var(--radius-lg, 8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
    
    <!-- Modal Header -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color, #334155); padding-bottom: 0.75rem;">
      <div>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
          <span style="font-size: 0.72rem; text-transform: uppercase; font-weight: 700; color: #10b981; letter-spacing: 0.05em;">Manual Outreach Confirmation</span>
          <span class="badge badge-success">Thunderbird Dispatch</span>
        </div>
        <h3 id="msm-company-title" style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary, #f8fafc); margin: 0;">Mark as Sent</h3>
        <div id="msm-candidate-id" style="font-size: 0.75rem; color: var(--text-secondary, #94a3b8); font-family: monospace;"></div>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" onclick="closeMarkSentModal()" style="font-size: 1.1rem; padding: 0.2rem 0.55rem; border-radius: 4px; line-height: 1; cursor: pointer;" title="Close (Esc)">✕</button>
    </div>

    <!-- Modal Form -->
    <form id="mark-sent-form" method="POST" action="" style="display: flex; flex-direction: column; gap: 0.85rem; overflow-y: auto;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" id="msm-return-to" name="return_to" value="">
      <input type="hidden" id="msm-idempotency" name="idempotency_token" value="">

      <!-- Sending Identity -->
      <div>
        <label class="form-label" style="font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; display: block;">
          Sending Identity (Authorized pyBIM Account) *
        </label>
        <select id="msm-sender-account" name="sender_account" class="form-control" required style="width: 100%; font-size: 0.85rem; padding: 0.4rem 0.6rem;">
          <option value="info@pybim.com" selected>info@pybim.com</option>
          <option value="info@pybim.it">info@pybim.it</option>
          <option value="careers@pybim.com">careers@pybim.com</option>
          <option value="support@pybim.com">support@pybim.com</option>
          <option value="hamed.sharifi@pybim.it">hamed.sharifi@pybim.it</option>
          <option value="hamid.lotfalian@pybim.it">hamid.lotfalian@pybim.it</option>
        </select>
        <span style="font-size: 0.72rem; color: var(--text-muted, #64748b);">Recorded as audit metadata only. No credentials stored.</span>
      </div>

      <!-- Verified Recipient Email -->
      <div>
        <label class="form-label" style="font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; display: block;">
          Exact Recipient Email *
        </label>
        <input type="email" id="msm-recipient-email" name="recipient_email" required class="form-control" style="width: 100%; font-size: 0.85rem; padding: 0.4rem 0.6rem;" placeholder="e.g. contact@domain.com">
      </div>

      <!-- Sent Date & Time (Europe/Rome) -->
      <div>
        <label class="form-label" style="font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; display: block;">
          Actual Sent Timestamp (Europe/Rome) *
        </label>
        <input type="text" id="msm-sent-at" name="sent_at" required class="form-control" style="width: 100%; font-size: 0.85rem; padding: 0.4rem 0.6rem;" placeholder="YYYY-MM-DD HH:MM:SS">
        <span style="font-size: 0.72rem; color: var(--text-muted, #64748b);">Defaults to current time in Italy (Europe/Rome).</span>
      </div>

      <!-- Subject (Optional) -->
      <div>
        <label class="form-label" style="font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; display: block;">
          Subject Line (Optional)
        </label>
        <input type="text" id="msm-subject" name="subject" class="form-control" style="width: 100%; font-size: 0.85rem; padding: 0.4rem 0.6rem;" placeholder="e.g. pyBIM Architectural &amp; MEP Collaboration Inquiry">
      </div>

      <!-- Notes (Optional) -->
      <div>
        <label class="form-label" style="font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; display: block;">
          Operator Notes / Follow-up Memo (Optional)
        </label>
        <input type="text" id="msm-notes" name="operator_notes" class="form-control" style="width: 100%; font-size: 0.85rem; padding: 0.4rem 0.6rem;" placeholder="Any context regarding the sent message or phone/verbal referral...">
      </div>

      <!-- Confirmation Checkbox (Required) -->
      <div style="background: rgba(16, 185, 129, 0.08); border-left: 3px solid #10b981; padding: 0.65rem 0.85rem; border-radius: 4px; margin-top: 0.25rem;">
        <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.82rem; font-weight: 600; color: var(--text-primary, #f8fafc); cursor: pointer; margin: 0;">
          <input type="checkbox" id="msm-confirm-check" name="confirm_thunderbird_sent" value="1" required style="margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0;">
          <span>I explicitly confirm that I have personally dispatched this email to the recipient via Thunderbird client.</span>
        </label>
      </div>

      <!-- Modal Footer Actions -->
      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; border-top: 1px solid var(--border-color, #334155); padding-top: 0.75rem; margin-top: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeMarkSentModal()" style="font-size: 0.85rem; padding: 0.4rem 0.85rem;">Cancel</button>
        <button type="submit" class="btn btn-success btn-sm" style="font-size: 0.85rem; padding: 0.4rem 1.1rem; background-color: #059669; border: none; font-weight: 700;">Confirm Mark as Sent</button>
      </div>
    </form>

  </div>
</div>

<script>
function openMarkSentModal(candidateId, companyName, defaultRecipient, defaultReturnTo) {
  var modal = document.getElementById('mark-sent-modal');
  if (!modal) return;
  
  var form = document.getElementById('mark-sent-form');
  form.action = '/sales/candidates/' + encodeURIComponent(candidateId) + '/mark-sent';
  
  document.getElementById('msm-company-title').textContent = companyName || 'Mark as Sent';
  document.getElementById('msm-candidate-id').textContent = candidateId;
  document.getElementById('msm-recipient-email').value = defaultRecipient || '';
  document.getElementById('msm-return-to').value = defaultReturnTo || (window.location.pathname + window.location.search);
  
  // Set default timestamp
  var now = new Date();
  var pad = function(n) { return n < 10 ? '0' + n : n; };
  var localStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
                 pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  document.getElementById('msm-sent-at').value = localStr;
  
  // Set idempotency token
  document.getElementById('msm-idempotency').value = 'idemp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
  document.getElementById('msm-confirm-check').checked = false;
  
  modal.style.display = 'flex';
}

function closeMarkSentModal() {
  var modal = document.getElementById('mark-sent-modal');
  if (modal) modal.style.display = 'none';
}

function handleMarkSentBackdrop(event) {
  if (event.target && event.target.id === 'mark-sent-modal') {
    closeMarkSentModal();
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeMarkSentModal();
});
</script>
